version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
  settings:
    misspell:
      ignore-words:
        - mosquitto
        - Mosquitto
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: true

linters-settings:
  misspell:
    ignore-words:
      - mosquitto
      - Mosquitto

formatters:
  enable:
    - gofmt
