name: CI Test & Build

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Go Test & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Download & setup Nabto Client SDK
        run: |
          chmod +x scripts/setup-sdk.sh
          ./scripts/setup-sdk.sh

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: |
          export LD_LIBRARY_PATH=$(pwd)/.sdk/lib:$LD_LIBRARY_PATH
          go test -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Compile Native Binaries (Smoke Test)
        run: |
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/launcher
          go build -v -o /dev/null ./cmd/steinel-bridge

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (Local Test)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=test
          tags: steinel-cam-bridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
