name: CI Test & Build

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Go Test & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download & setup Nabto Client SDK
        run: |
          chmod +x scripts/setup-sdk.sh
          ./scripts/setup-sdk.sh

      - name: Run Go Vet
        run: go vet ./...

      - name: Compile Native Binary (Smoke Test)
        run: go build -v -o /dev/null ./cmd/steinel-bridge

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: steinel-cam-bridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
