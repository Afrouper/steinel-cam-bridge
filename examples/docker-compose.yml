services:
  steinel-cam-bridge:
    image: ghcr.io/afrouper/steinel-cam-bridge:latest
    container_name: steinel-cam-bridge
    restart: unless-stopped
    network_mode: host # Empfohlen für WS-Discovery (UDP 3702), mDNS und direkte P2P-Verbindungen

    # --- Security Hardening ---
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # Erlaubt User 1000 das Binden von Standard-Ports < 1024 (falls gewünscht)
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M

    environment:
      # Pfad zur Multi-Kamera-Konfigurationsdatei (Beispiel siehe config.json)
      - CONFIG_PATH=/config/config.json
      # Optional: Log-Level überschreiben (trace, debug, info, warn, error)
      - LOG_LEVEL=info

    volumes:
      # Multi-Kamera Konfigurationsdatei (L 625 Haustür & L 620 Garten)
      - ./config.json:/config/config.json:ro
      # Persistentes Datenverzeichnis (ECC-Keys, lokaler Aufnahme-Cache in /data/recordings)
      - ./data:/data

    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 64M
    pids_limit: 150

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
