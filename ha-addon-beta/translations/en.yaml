configuration:
  camera_ip:
    name: "Camera IP Address"
    description: "The local IPv4 address of your Steinel CAM light (e.g. 192.168.1.100)."
  camera_type:
    name: "Camera Model"
    description: "Camera model type: 'auto' (automatic port detection), 'l625' (L 625 CAM SC / WebRTC), or 'l620' (L 620 CAM / XLED CAM 1 / Sofia)."
  qr_code:
    name: "QR Code String (L 625)"
    description: "The pairing QR code payload from the Steinel app (format: did=...,pid=...,sct=...,pairPwd=...)."
  reset_pairing:
    name: "Reset Pairing"
    description: "Delete stored cryptographic client key and force fresh pairing with the camera."
  camera_password:
    name: "Camera Password (L 620)"
    description: "Password for L 620 CAM authentication."
  camera_user:
    name: "Camera Username (L 620)"
    description: "Username for L 620 CAM (default: admin)."
  resolution:
    name: "Video Resolution"
    description: "Target camera resolution (1080p, 720p, or 360p)."
  audio_codec:
    name: "Audio Codec"
    description: "RTSP/ONVIF audio codec: 'aac' (transcoded, recommended) or 'pcmu' (raw passthrough)."
  rtsp_port:
    name: "RTSP Port"
    description: "Port for the integrated RTSP server (default: 8554)."
  onvif_port:
    name: "ONVIF & REST Port"
    description: "Port for the integrated ONVIF and SD card REST API server (default: 8000)."
  sdcard_sync_interval:
    name: "SD Card Sync Interval"
    description: "Interval in seconds to check the camera's MicroSD card for new recordings (default: 30s)."
  nabto_driver:
    name: "Nabto Edge Driver (L 625)"
    description: "Driver engine for L 625 CAM SC: 'pure' (native Go stack, no C-SDK) or 'cgo' (fallback using libnabto_client.so)."
  debug:
    name: "Debug Logging"
    description: "Enable verbose debug logging for troubleshooting."
  mqtt_broker:
    name: "MQTT Broker URL"
    description: "Optional custom MQTT broker URL (e.g. tcp://192.168.1.50:1883). Leave empty to use auto-discovered Home Assistant Mosquitto broker."
  mqtt_user:
    name: "MQTT Username"
    description: "Optional MQTT username."
  mqtt_password:
    name: "MQTT Password"
    description: "Optional MQTT password."
  mqtt_topic_prefix:
    name: "MQTT Topic Prefix"
    description: "Base topic prefix for MQTT entities (default: steinel)."
  mqtt_discovery_prefix:
    name: "MQTT Discovery Prefix"
    description: "Home Assistant MQTT Auto-Discovery prefix (default: homeassistant)."
