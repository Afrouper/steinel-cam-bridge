configuration:
  camera_ip:
    name: "Kamera IP-Adresse"
    description: "Die lokale IPv4-Adresse der Steinel CAM Leuchte im Heimnetzwerk (z. B. 192.168.1.100)."
  camera_type:
    name: "Kameramodell"
    description: "Modellauswahl: 'auto' (automatische Erkennung), 'l625' (L 625 CAM SC / WebRTC) oder 'l620' (L 620 CAM / XLED CAM 1 / Sofia)."
  qr_code:
    name: "QR-Code String (L 625)"
    description: "Der Pairing QR-Code Inhalt aus der Steinel Smartphone App (Format: did=...,pid=...,sct=...,pairPwd=...)."
  reset_pairing:
    name: "Pairing zurücksetzen"
    description: "Löscht den gespeicherten Client-Schlüssel und erzwingt ein erneutes Pairing mit der Kamera."
  camera_password:
    name: "Kamera Passwort (L 620)"
    description: "Passwort für die Authentifizierung an der L 620 CAM."
  camera_user:
    name: "Kamera Benutzername (L 620)"
    description: "Benutzername für die L 620 CAM (Standard: admin)."
  resolution:
    name: "Videoauflösung"
    description: "Auflösung des Videostreams (1080p, 720p oder 360p)."
  audio_codec:
    name: "Audio-Codec"
    description: "Audio-Format des RTSP/ONVIF-Streams: 'aac' (transkodiert, empfohlen) oder 'pcmu' (Rohdaten)."
  rtsp_port:
    name: "RTSP-Port"
    description: "Netzwerkport des integrierten RTSP-Servers (Standard: 8554)."
  onvif_port:
    name: "ONVIF & REST Port"
    description: "Netzwerkport des integrierten ONVIF- und SD-Karten-REST-API-Servers (Standard: 8000)."
  sdcard_sync_interval:
    name: "SD-Karten Sync-Intervall"
    description: "Intervall in Sekunden zur Hintergrundabfrage neuer Aufnahmen von der MicroSD-Karte (Standard: 30s)."
  nabto_driver:
    name: "Nabto Edge Treiber (L 625)"
    description: "Treiber für die L 625 CAM SC: 'pure' (nativer Go-Stack, C-SDK-frei) oder 'cgo' (Fallback mit libnabto_client.so)."
  debug:
    name: "Debug-Logging"
    description: "Aktiviert ausführliche Protokollausgaben zur Fehlersuche."
  mqtt_broker:
    name: "MQTT Broker URL"
    description: "Optionale benutzerdefinierte MQTT-Broker-Adresse (z. B. tcp://192.168.1.50:1883). Leer lassen für automatische Erkennung des Home Assistant Mosquitto Brokers."
  mqtt_user:
    name: "MQTT Benutzername"
    description: "Optionaler Benutzername für den MQTT-Broker."
  mqtt_password:
    name: "MQTT Passwort"
    description: "Optionales Passwort für den MQTT-Broker."
  mqtt_topic_prefix:
    name: "MQTT Topic-Präfix"
    description: "Basis-Präfix für MQTT-Topics (Standard: steinel)."
  mqtt_discovery_prefix:
    name: "MQTT Discovery-Präfix"
    description: "Home Assistant Auto-Discovery Präfix (Standard: homeassistant)."
