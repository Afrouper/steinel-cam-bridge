name: "Steinel CAM Bridge"
description: "Standalone ONVIF, 2-Way Audio & MQTT Bridge für Steinel L 625 CAM SC"
version: "0.9.8"
slug: "steinel_cam_bridge"
url: "https://github.com/Afrouper/steinel-cam-bridge"
arch:
  - aarch64
  - amd64
init: false
host_network: true
services:
  - "mqtt:want"
options:
  camera_ip: "192.168.1.100"
  qr_code: ""
  resolution: "1080p"
  audio_codec: "aac"
  rtsp_port: 8554
  onvif_port: 8000
  reset_pairing: false
schema:
  camera_ip: "str"
  qr_code: "str?"
  resolution: "list(1080p|720p|360p)"
  audio_codec: "list(aac|pcmu)"
  rtsp_port: "port"
  onvif_port: "port"
  reset_pairing: "bool?"
  mqtt_broker: "str?"
  mqtt_user: "str?"
  mqtt_password: "password?"
  mqtt_topic_prefix: "str?"
  mqtt_discovery_prefix: "str?"
image: "ghcr.io/afrouper/steinel-cam-bridge"
